global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ticketing-app'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'dev'
      password: 'dev'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: ticketing
